<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>2x4 Slow Breathing Op-Art</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fff;
        }

        .container {
            display: grid;
            /* 가로 2단, 세로 4단 설정 */
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 100vw;
            height: 100vh;
        }

        .face {
            width: 100%;
            height: 100%;
            outline: 0.3px solid #f0f0f0;
            cursor: pointer;
            background: repeating-linear-gradient(
                var(--angle),
                #000,
                #000 1px,
                #fff 1px,
                #fff var(--spacing)
            );
        }

        .face:hover {
            outline: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container" id="pattern-container"></div>

<script>
    const container = document.getElementById('pattern-container');
    const faces = [];
    const cols = 2;
    const rows = 4;
    const totalFaces = cols * rows;

    for (let i = 0; i < totalFaces; i++) {
        const face = document.createElement('div');
        face.className = 'face';
        
        const baseAngle = Math.random() * 360;
        const direction = Math.random() > 0.5 ? 1 : -1;
        
        // 초기 회전 속도: 아주 느리게 (0.05 ~ 0.2)
        let speed = 0.05 + Math.random() * 0.15; 
        
        // --- 간격 애니메이션 설정 ---
        const baseSpacing = 2.5 + Math.random() * 2; // 기준 간격 (매우 촘촘함)
        const spacingRange = 4 + Math.random() * 6; // 변화 폭
        // 변화 속도를 이전보다 3~5배 더 천천히 (0.0003~0.0007)
        const spacingAnimSpeed = 0.0003 + Math.random() * 0.0004; 
        const spacingOffset = Math.random() * Math.PI * 2;

        const faceData = {
            el: face,
            baseAngle: baseAngle,
            direction: direction,
            speed: speed,
            currentRotation: baseAngle,
            baseSpacing: baseSpacing,
            spacingRange: spacingRange,
            spacingAnimSpeed: spacingAnimSpeed,
            spacingOffset: spacingOffset
        };

        // 클릭 시 속도 증가 이벤트
        face.addEventListener('click', () => {
            faceData.speed += 8; 
            if (faceData.speed > 80) {
                faceData.speed = 0.05 + Math.random() * 0.15;
            }
        });

        faces.push(faceData);
        container.appendChild(face);
    }

    let lastTimestamp = 0;
    function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const deltaTime = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        faces.forEach(f => {
            // 1. 회전 애니메이션
            f.currentRotation += (f.direction * f.speed * deltaTime * 15);
            f.el.style.setProperty('--angle', `${f.currentRotation}deg`);

            // 2. 선 간격 애니메이션 (매우 느린 호흡)
            // timestamp에 f.spacingAnimSpeed를 곱해 변화 속도를 극도로 늦춤
            const currentSpacing = f.baseSpacing + (Math.sin(timestamp * f.spacingAnimSpeed + f.spacingOffset) + 1) * (f.spacingRange / 2);
            f.el.style.setProperty('--spacing', `${currentSpacing}px`);
        });

        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
</script>

</body>
</html>
